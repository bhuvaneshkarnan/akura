  <text x="76" y="48" font-family="'Montserrat', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#58EDA2" letter-spacing="2.2">DE ADDICTION &amp; REHABILITATION CENTRE</text>
  <text x="76" y="59" font-family="'Montserrat', -apple-system, sans-serif" font-size="8" font-weight="500" fill="#A0C8BF" letter-spacing="1.2">VADIPATTI, MADURAI • 24/7 CARE</text>
</svg>
